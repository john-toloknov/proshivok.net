function injectStyles() {

        .content-container { width: 60%; height: 100vh; background-color: #FFD700; padding: 0; overflow-y: auto; box-sizing: border-box; transition: width 0.5s ease; position: relative; }

function openAccordion() {
    const accordionContainer = document.querySelector('.accordion-container');
    const contentContainer = document.querySelector('.content-container');
    const toggleBtn = document.querySelector('.toggle-accordion-btn');
    accordionContainer.classList.remove('hidden-accordion-container');
    contentContainer.classList.remove('expanded-content-container');
    accordionContainer.classList.add('full-width-accordion');
    contentContainer.classList.add('hidden-content');
    toggleBtn.classList.add('hidden');
}

function showContentAndCloseAccordion(event) {
    if(event) event.preventDefault();
    const accordionContainer = document.querySelector('.accordion-container');
    const contentContainer = document.querySelector('.content-container');
    const toggleBtn = document.querySelector('.toggle-accordion-btn');
    accordionContainer.classList.remove('full-width-accordion');
    contentContainer.classList.remove('hidden-content');
    accordionContainer.classList.add('hidden-accordion-container');
    contentContainer.classList.add('expanded-content-container');
    toggleBtn.classList.remove('hidden');
    
    // Закрываем всё при клике на HOME
    document.querySelectorAll(".accordion, .sub-accordion").forEach(acc => acc.classList.remove("active"));
    document.querySelectorAll('.panel, .apps-grid').forEach(p => p.style.maxHeight = null);
}

function initAccordionLogic() {
    // Логика главных разделов первого уровня (HOME, Прошивки, Приложения, Telegram)
    const mainAccordions = document.querySelectorAll(".accordion-container > .accordion");
    
    mainAccordions.forEach(button => {
        // Пропускаем HOME и Telegram, у них своя логика
        if (button.id === 'home-btn' || button.id === 'telegram-btn') return;

        button.addEventListener("click", function() {
            const panel = this.nextElementSibling;
            const isOpen = this.classList.contains("active");

            // Сначала закрываем абсолютно все главные разделы и их контент
            mainAccordions.forEach(acc => {
                acc.classList.remove("active");
                const p = acc.nextElementSibling;
                if (p && (p.classList.contains('panel') || p.classList.contains('apps-grid'))) {
                    p.style.maxHeight = null;
                    // Закрываем также все вложенные элементы внутри них
                    p.querySelectorAll('.sub-accordion').forEach(sub => sub.classList.remove('active'));
                    p.querySelectorAll('.panel, .apps-grid').forEach(subP => subP.style.maxHeight = null);
                }
            });

            // Если он был закрыт — открываем
            if (!isOpen) {
                this.classList.add("active");
                if (panel) {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                }
            }
        });
    });

    // Логика вложенных аккордеонов (модели роутеров или Android/iOS)
    const subAccordions = document.querySelectorAll(".sub-accordion");
    subAccordions.forEach(subBtn => {
        subBtn.addEventListener("click", function(e) {
            e.stopPropagation(); // чтобы клик не уходил наверх
            const subPanel = this.nextElementSibling;
            if (!subPanel) return;

            const parentContainer = this.parentElement;
            const isSubOpen = this.classList.contains("active");

            // Определяем, это подменю прошивок (где нужно открывать только по одному) 
            // или подменю приложений (где Android и iOS могут открываться независимо)
            const isFirmwareList = parentContainer.tagName === 'DIV' && !parentContainer.classList.contains('apps-grid') && !parentContainer.closest('.apps-grid');

            if (isFirmwareList) {
                // Закрываем соседние элементы в том же списке роутеров
                parentContainer.querySelectorAll(':scope > .sub-accordion').forEach(sibling => {
                    if (sibling !== this) {
                        sibling.classList.remove("active");
                        const p = sibling.nextElementSibling;
                        if (p) p.style.maxHeight = null;
                    }
                });
            }

            // Переключаем текущий
            this.classList.toggle("active");
            if (isSubOpen) {
                subPanel.style.maxHeight = null;
            } else {
                subPanel.style.maxHeight = subPanel.scrollHeight + "px";
            }

            // Корректируем высоту родительского главного панели, чтобы скролл работал правильно
            let parentPanel = this.closest('.panel');
            if (parentPanel && parentPanel.style.maxHeight) {
                parentPanel.style.maxHeight = parentPanel.scrollHeight + 500 + "px";
            }
        });
    });
}

}
