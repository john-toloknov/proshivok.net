function openAccordion() {
    const accordionContainer = document.querySelector('.accordion-container');
    const contentContainer = document.querySelector('.content-container');
    const toggleBtn = document.querySelector('.toggle-accordion-btn');
    accordionContainer.classList.remove('hidden-accordion-container');
    contentContainer.classList.remove('expanded-content-container');
    accordionContainer.classList.add('full-width-accordion');
    contentContainer.classList.add('hidden-content');
    toggleBtn.classList.add('hidden');
}

function showContentAndCloseAccordion(event) {
    if(event) event.preventDefault();
    const accordionContainer = document.querySelector('.accordion-container');
    const contentContainer = document.querySelector('.content-container');
    const toggleBtn = document.querySelector('.toggle-accordion-btn');
    accordionContainer.classList.remove('full-width-accordion');
    contentContainer.classList.remove('hidden-content');
    accordionContainer.classList.add('hidden-accordion-container');
    contentContainer.classList.add('expanded-content-container');
    toggleBtn.classList.remove('hidden');
    const accordions = document.querySelectorAll(".accordion");
    accordions.forEach(acc => {
         acc.classList.remove("active");
         const panel = acc.nextElementSibling;
         if (panel && panel.classList.contains('panel')) { panel.style.maxHeight = null; }
    });
}
